name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Code layo
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # 2. Node.js setup karo (Latest LTS: v22)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' 
      
      # 3. pnpm setup karo (Official Action - Sabse Safe)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 # Ya jo bhi latest stable ho
      
      # 4. Ab dependencies install karo
      - name: Install dependencies
        run: pnpm install
      
      # 5. Build check
      - name: Build project
        run: pnpm build
      
      # 6. Test run
      - name: Run tests
        run: pnpm test
